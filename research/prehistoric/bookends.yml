    dating:
      precision: range
      earliest_year: -3100
      latest_year: -2900
      approximate: true
    research_window:
      end_exclusive: -3000.1.1
    source_refs:
    - id: pre_src_barley_tablet_met
      locator: Object details, date, period and description
    confidence: high
    integration:
      status: collected
      note: The dated range crosses the cutoff and does not establish an invention date or certain pre-3000
