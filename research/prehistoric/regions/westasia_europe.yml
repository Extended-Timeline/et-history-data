        extend beyond this phase.
  wae_malta_megalithic_temples:
    entity: Megalithic temples of Malta
    subject: monumental_architecture
    finding: The Maltese temple tradition includes monumental buildings erected during the fourth and third
      millennia BCE; the full reported tradition extends beyond 3000 BCE.
    dating:
      precision: range
      earliest_year: -4000
      latest_year: -2000
      approximate: true
      reported_range:
        earliest_year: -4000
        latest_year: -2000
        unit: BCE
      research_window:
        earliest_year: -4000
        latest_year_exclusive: -3000
    source_refs:
    - id: wae_src_malta_unesco
      locator: Description
    confidence: high
    integration:
      status: collected
      note: UNESCO's reported fourth- and third-millennium span is retained; this research window ends before
