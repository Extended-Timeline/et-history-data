    scope: crosses_boundary
  wae_stonehenge_landscape_early:
    entity: Stonehenge landscape
    subject: monuments_and_burial
    finding: By about 3500 BCE, farming communities in the Stonehenge landscape had built causewayed enclosures,
      cursus monuments, and long barrows; the first Stonehenge earthwork followed around 3000 BCE.
    dating:
      precision: range
      earliest_year: -3500
      latest_year: -3000
      approximate: true
    source_refs:
    - id: wae_src_stonehenge_timeline
      locator: Timeline, 3500–3000 BC
    confidence: high
    integration:
      status: collected
      note: Later stone-circle construction is outside this research period; the circa-3000 boundary is approximate.
    scope: crosses_boundary
    research_window:
      end_exclusive: -3000.1.1
      note: Landscape activity before the cutoff is in scope; the circa-3000-BCE earthwork is boundary context.
  wae_britain_neolithic_arrival:
    entity: Britain and Ireland
    subject: farming_transition
    finding: Farming reached Britain around 4000 BCE through inward migration from continental Europe, bringing
      domestic cereals and livestock and transforming settlement and land use.
    dating:
