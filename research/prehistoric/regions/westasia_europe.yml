  wae_trypillia_settlements:
    entity: Cucuteni-Trypillia archaeological complex
    subject: settlement_and_agriculture
    finding: Between about 4900 and 4050 BCE, Cucuteni-Trypillia settlements expanded across parts of present-day
      Romania, Moldova, and Ukraine in agriculturally favorable landscapes.
    dating:
      precision: range
      earliest_year: -4900
      latest_year: -4050
      approximate: true
    source_refs:
    - id: wae_src_trypillia_unesco
      locator: Development stages and settlement siting
    confidence: medium
    integration:
      status: collected
