project:
  mod_path: 'repo/Extended Timeline'
  history_path: et-history-data
  converter_path: et-converter
  chronological_classes: et-history-data/periods/universal.yml
  mod_start_date: '58.2.1'
  mod_end_date: '9999.12.31'
  current_age: age_1_traditions
  replace_paths:
    - main_menu/common/defines
