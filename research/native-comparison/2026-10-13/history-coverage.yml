limits:
- Native+mod ID sets are extracted with the current converter regex; this is not validation
  against engine parsing.
- A nonempty folded state can be a name or a partial datum, not a complete playable
  state.
- Location model entries are emitted even when their historical state at the probe
  date is empty.
- Research records under research/ are not loaded by build_world.
- No mod output or cache was generated; history data were read only.
- Country/location coverage probes count nonempty states only; they do not establish
  field completeness or correct ownership. Character probes descend into entity IDs
  and use independent deep copies for each fold.
