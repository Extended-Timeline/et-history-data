  pre_uruk_urban_architecture:
    entity: Uruk, southern Mesopotamia
    subject: urbanization_and_monumental_architecture
    finding: By approximately 3200 BCE, Uruk was a major urban settlement with monumental mudbrick buildings
      and walls decorated with painted clay-cone mosaics.
    dating:
