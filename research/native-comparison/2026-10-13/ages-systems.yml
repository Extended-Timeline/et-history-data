comparisons:
  - id: age_catalog
    native: 'in_game/common/age/00_default.txt: age_1_traditions year=1; age_2_renaissance year=1342; age_3_discovery year=1437; age_4_reformation year=1537; age_5_absolutism year=1637; age_6_revolutions year=1737'
    project: 'et-history-data/periods/universal.yml: six global chronological classes; prehistoric ends -3000.1.1'
    converter: 'etl/gen_countries.py:9-10, 100-101 emits age_1_traditions globally'
    classification: 'historical_design_gap'
    impact: 'Calendar classes do not trigger six gameplay age transitions; prehistoric facts cannot be treated as EU5 age definitions.'
    priority: high
  - id: date_window
    native: 'loading_screen/common/defines/00_defines.txt:2-3; start 1337.4.1, end 1836.12.31'
    project: 'loading_screen/common/defines/00_defines.txt:2-3; start 58.2.1, end 9999.12.31'
    converter: 'etl/generate.py defaults to 58.2.1 and emits one selected snapshot'
    classification: 'project_override'
    impact: 'A long end date is configured, but does not by itself establish tested engine support or playable historic progression.'
    priority: high
  - id: negative_dates
    native: 'in_game/common/age/00_default.txt:1-2 first native age starts at year 1; inspected examples do not establish BCE behavior'
    project: 'et-history-data uses signed BCE year strings, including -3000.1.1'
    converter: 'etl/dates.py parses signed years; runtime interpretation of BCE dates remains unverified'
    classification: 'design_question'
    impact: 'Converter date acceptance is not proof that the game engine can load, display, or simulate negative years.'
    priority: high
  - id: tech_level
    native: 'in_game/common/advances/0_age_of_traditions.txt:1,14,22,29; starting_technology_level gates advances in age 1'
    project: 'main_menu/setup/start/10_countries.txt:18 uses level 3 in sampled emitted country'
    converter: 'etl/gen_countries.py:9,75-78 writes constant level 3'
    classification: 'converter_lossy'
    impact: 'One level is assigned to every country without date, region, evidence, or per-advance state.'
    priority: high
  - id: advance_catalog
    native: 'in_game/common/advances/0_age_of_traditions.txt:4-62 contains written_alphabet, codified_laws, mapmaking, colonies and age/prerequisite gates'
    project: 'No project-local in_game/common/advances definitions; vanilla definitions are inherited'
    converter: 'No conversion emits country advance research or known/unknown advance state'
