  process_requirement: Track transitions with dated before/after states, scope, proposed mechanisms, evidence
    for each mechanism, alternatives, and uncertainty.
  interpretation_rule: No invented named prehistoric people, rulers, houses, or dynasties.
  priority: medium
- category: ethnicity_portrait
  id: r07
  native_path: in_game/common/ethnicities/00_ethnicities_european.txt:1-25
  native_keys:
  - template
  - skin_color
  - eye_color
  - hair_color
  history_requirement: Keep biological phenotype/portrait assignment separate from cultural or historical identity
