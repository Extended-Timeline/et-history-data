        transition.
  wae_varna_copper_age_burials:
    entity: Varna cemetery
    subject: burial_and_metalworking
    finding: Late fifth-millennium BCE cemetery burials at Varna included elaborate grave assemblages and some
      of Europe's earliest substantial gold artifacts.
    dating:
      precision: range
      earliest_year: -4600
      latest_year: -4200
      approximate: true
    source_refs:
    - id: wae_src_varna_museum
      locator: Collection chronology and cemetery overview
    confidence: medium
    integration:
