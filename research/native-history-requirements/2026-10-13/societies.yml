requirements:
- category: culture_snapshot
  id: r01
  native_path: in_game/common/cultures/00_cultures.info:1-28
  native_keys:
  - culture.language
  - culture_groups
  - tags
  - opinions
  - modifiers
  history_requirement: Dated location/pop culture assignment, identity label, validity interval, spatial precision,
    confidence, and alternative interpretations.
  process_requirement: Track transitions with dated before/after states, scope, proposed mechanisms, evidence
    for each mechanism, alternatives, and uncertainty.
  interpretation_rule: Graphics tags and modifiers are game effects, not historical evidence.
  priority: high
- category: culture_membership
  id: r02
  native_path: in_game/common/cultures/scandinavian.txt:1-19
  native_keys:
  - culture_groups
  history_requirement: Record which documented cultures a group label covers and when; permit nested or overlapping
    affinities.
  process_requirement: Track transitions with dated before/after states, scope, proposed mechanisms, evidence
    for each mechanism, alternatives, and uncertainty.
  interpretation_rule: Shared material assemblages alone do not prove common self-identity.
  priority: medium
- category: group_taxonomy
  id: r03
  native_path: in_game/common/culture_groups/00_culture_groups.txt:1-8
  native_keys:
  - culture group definitions
  history_requirement: Keep grouping rationale and date range explicit; allow membership uncertainty and competing
    groupings.
  process_requirement: Track transitions with dated before/after states, scope, proposed mechanisms, evidence
    for each mechanism, alternatives, and uncertainty.
  interpretation_rule: A game culture group is not automatically a linguistic family, ethnicity, or polity.
  priority: medium
- category: language_snapshot
  id: r04
  native_path: in_game/common/languages/00_italy.txt:1-18
  native_keys:
  - language family
  - fallback
  - male_names
  - female_names
  - dynasty_names
  history_requirement: Record language/dialect, geographic and chronological scope, evidence basis, reconstruction
    status, and uncertainty.
  process_requirement: Track transitions with dated before/after states, scope, proposed mechanisms, evidence
    for each mechanism, alternatives, and uncertainty.
  interpretation_rule: Do not assign language to archaeological cultures without independent historical-linguistic
    support.
  priority: high
- category: language_family
  id: r05
  native_path: in_game/common/language_families/00_language_families.txt:1-8
  native_keys:
  - language family definitions
  history_requirement: Track proposed family, proto-language, divergence dates, and competing models as hypotheses
    with confidence.
  process_requirement: Track transitions with dated before/after states, scope, proposed mechanisms, evidence
    for each mechanism, alternatives, and uncertainty.
  interpretation_rule: Family resemblance is not a migration date or a biological ancestry claim.
  priority: medium
- category: names
  id: r06
  native_path: in_game/common/languages/00_italy.txt:8-18
  native_keys:
  - language-specific name pools
  history_requirement: Require attested names or clearly labeled linguistic reconstructions with source, language,
