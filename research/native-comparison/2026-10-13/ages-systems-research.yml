    entity: archaeological_site
    subject: copper_based_metallic_finds
    finding: A concentration of metallic finds from Çatalhöyük levels South M–O is dated to approximately 6600–6450
      BC. The chapter reviews copper-based objects and preliminary analyses; their presence does not by itself
      establish local smelting or manufacture.
    dating:
