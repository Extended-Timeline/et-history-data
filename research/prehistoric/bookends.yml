  pre_namorotukunan_oldowan:
    entity: Namorotukunan, East Turkana Basin, Kenya
    subject: early_hominin_technology
    finding: Three archaeological horizons document Oldowan stone-tool production across approximately 2.75–2.44
      million years ago, with systematic selection of rock types.
    dating:
      precision: relative
      reported_range:
      - 2750000
      - 2440000
      unit: years_ago
      reference_year: null
      calibrated: null
      approximate: true
    source_refs:
