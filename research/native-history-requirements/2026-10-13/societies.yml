  process_requirement: Track transitions with dated before/after states, scope, proposed mechanisms, evidence
    for each mechanism, alternatives, and uncertainty.
  interpretation_rule: Native file comment describes gene-driven portrait templates; do not make these templates
    ancient ethnic group definitions.
  priority: high
- category: religion_snapshot
  id: r08
